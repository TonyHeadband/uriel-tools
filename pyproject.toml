[project]
name = "uriel-tools"
version = "0.11.0"
description = "MCP tool server for the Uriel family assistant, gated by caller groups"
readme = "README.md"
authors = [
    { name = "TonyHeadband", email = "41022017+TonyHeadband@users.noreply.github.com" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=3.4.7,<4",
    "httpx>=0.28.1",
    "odfpy>=1.4.1",
    "openpyxl>=3.1.5",
    "pillow>=12.3.0",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "pymupdf>=1.26",
    "pypdf>=6.19.0",
    "pypdfium2>=5.13.0",
    "python-dateutil>=2.9",
    "python-docx>=1.2.0",
    "pyyaml>=6",
    "starlette>=0.54",
    "tzdata>=2025.2",
    "uvicorn[standard]>=0.35",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "ruff>=0.13",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "db: needs Postgres (URIEL_TEST_DATABASE_URL)",
  "e2e: needs the compose stack (URIEL_E2E_MCP_URL)",
  "live: talks to real services (Ollama, Nextcloud, SearXNG); each test skips without its URIEL_LIVE_* settings",
]
addopts = "-m 'not e2e and not live'"

[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
